<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060818">
  <title>Altersbestätigung</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #e0182e;
      --text: #eef0f9;
      --muted: #8a93ba;
      --border: rgba(224,24,46,.18);
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(circle at top center, rgba(224,24,46,.18), transparent 32%),
        linear-gradient(180deg, #090b20 0%, #060818 40%, #04060f 100%);
    }
    .card {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 440px;
      padding: 42px 24px 30px;
      text-align: center;
      background: linear-gradient(180deg, rgba(22,26,66,.97), rgba(12,16,40,.97));
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 22px 60px rgba(0,0,0,.45);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at top right, rgba(224,24,46,.14), transparent 35%);
    }
    h1, p, .buttons { position: relative; z-index: 1; }
    h1 {
      font-size: clamp(32px, 8vw, 42px);
      line-height: 1.08;
      letter-spacing: -.04em;
      font-weight: 900;
      margin-bottom: 14px;
    }
    h1 span { color: #f5263e; }
    .description {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .buttons { display: grid; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 62px;
      padding: 15px 18px;
      border-radius: 18px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      transition: transform .15s ease, filter .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.98); }
    .yes {
      color: #fff;
      background: linear-gradient(180deg, #f5263e 0%, #c0101e 100%);
      box-shadow: 0 18px 40px rgba(224,24,46,.30), inset 0 1px 0 rgba(255,255,255,.16);
    }
    .yes:hover { filter: brightness(1.06); }
    .no {
      color: #eef0f9;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.12);
    }
    .no:hover { background: rgba(255,255,255,.09); }
    @media (max-width: 360px) {
      .card { padding: 34px 18px 26px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Wie alt <span>bist du?</span></h1>
    <p class="description">Bitte bestätige dein Alter, um fortzufahren.</p>
    <div class="buttons">
      <a class="btn yes" href="/home/">Ich bin 21 oder älter</a>
      <a class="btn no" href="/home/">Ich bin unter 21</a>
    </div>
  </main>
  <script>
    const query = window.location.search;
    document.querySelectorAll('.buttons a').forEach(link => {
      link.href = link.href + query;
    });
  </script>
</body>
</html>
